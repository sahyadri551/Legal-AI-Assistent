[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-legal-research-assistant"
version = "0.1.0"
description = "CPU-first hybrid BM25 + dense RAG prototype for Indian legal research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0,<0.117.0",
  "uvicorn[standard]>=0.32.0,<0.35.0",
  "streamlit>=1.40.0,<1.42.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "httpx>=0.27.0,<0.29.0",
  "openai>=1.109.0,<2.0.0",
  "ollama>=0.5.0,<0.6.0",
  "numpy>=1.26.0,<3.0.0",
  "sentence-transformers>=3.3.0,<4.0.0",
  "faiss-cpu>=1.9.0,<1.11.0",
  "rank-bm25>=0.2.2,<0.3.0",
  "pypdf>=5.0.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
