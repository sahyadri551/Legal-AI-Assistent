services:
  - type: web
    name: legal-ai-backend
    runtime: python
    plan: 1c-2g
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=src uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: DOCUMENT_MAX_MB
        value: "15"
      - key: FRONTEND_ORIGINS
        fromService:
          name: legal-ai-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: legal-ai-frontend
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run src/frontend/app.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: BACKEND_URL
        fromService:
          name: legal-ai-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
